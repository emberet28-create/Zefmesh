<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Help &amp; FAQ: Orders, Delivery, Payment, Care | Zefmesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="zef-data.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#f0eeee;color:#170a0b;font-family:'Instrument Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
@keyframes zefPage{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</helmet>
<dc-import name="Header" page="help" hint-size="100%,0px"></dc-import>
<main data-page="" data-screen-label="Help" style="animation:zefPage .45s cubic-bezier(.16,1,.3,1) both">

  <section data-dark="1" style="background:#140607;color:#f7f4f4;padding:calc(110px + clamp(24px,4vw,56px)) clamp(16px,3vw,44px) clamp(48px,6vw,80px)">
    <nav aria-label="Breadcrumb" style="display:flex;gap:8px;font-size:13px;color:#a29899;margin-bottom:24px"><a href="Home.dc.html" style-hover="color:#f7f4f4">Home</a><span>/</span><span style="color:#f7f4f4">Help and FAQ</span></nav>
    <h1 style="font-size:clamp(52px,8vw,140px);line-height:.86;letter-spacing:-.06em;font-weight:500">How can we <span style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-.025em">help?</span></h1>
    <div role="search" style="margin-top:clamp(28px,4vw,48px);display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:2px solid #f7f4f4;max-width:900px">
      <input data-page-search="" value="{{ q }}" onInput="{{ onQ }}" placeholder="Search delivery, payment, warranty…" aria-label="Search help" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:clamp(22px,2.6vw,38px);letter-spacing:-.02em;color:#f7f4f4;padding:6px 0">
      <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}"><button onClick="{{ clearQ }}" style="height:36px;padding:0 14px;border-radius:18px;border:1px solid #4a3336;font-size:13px">Clear</button></sc-if>
    </div>
  </section>

  <section style="padding:clamp(40px,5vw,72px) clamp(16px,3vw,44px) clamp(72px,9vw,130px);display:flex;flex-wrap:wrap;gap:32px clamp(32px,5vw,80px);align-items:flex-start">
    <nav aria-label="Topics" style="flex:0 1 260px;position:{{ navPos }};top:100px;display:flex;flex-direction:column;gap:2px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6e6364;margin-bottom:8px">Topics</span>
      <sc-for list="{{ topics }}" as="t" hint-placeholder-count="6">
        <a href="{{ t.href }}" style="display:flex;justify-content:space-between;padding:9px 12px;margin:0 -12px;border-radius:10px;font-size:15px" style-hover="background:#e6e2e2">{{ t.label }}<span aria-hidden="true" style="color:#8e8485">→</span></a>
      </sc-for>
    </nav>
    <div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:clamp(36px,4vw,56px)">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="0">
        <div id="{{ g.id }}" style="scroll-margin-top:100px">
          <h2 style="font-size:clamp(26px,2.4vw,36px);letter-spacing:-.03em;font-weight:500;margin-bottom:14px">{{ g.label }}</h2>
          <div style="border-top:1px solid #170a0b">
            <sc-for list="{{ g.items }}" as="f" hint-placeholder-count="0">
              <div style="border-bottom:1px solid #c7bebe">
                <button onClick="{{ f.toggle }}" aria-expanded="{{ f.aria }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;text-align:left;font-size:clamp(17px,1.4vw,20px);font-weight:500;letter-spacing:-.01em"><span>{{ f.q }}</span><span style="flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:{{ f.bg }};color:{{ f.fg }};font-size:18px;transform:rotate({{ f.rot }});transition:transform .4s cubic-bezier(.16,1,.3,1),background .3s,color .3s">+</span></button>
                <div style="display:grid;grid-template-rows:{{ f.rows }};transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1)"><div style="overflow:hidden"><p style="padding:0 48px 20px 0;font-size:16.5px;line-height:1.65;color:#4a3336">{{ f.a }}</p></div></div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{ none }}" hint-placeholder-val="{{ false }}">
        <p style="font-size:22px;line-height:1.3;color:#4a3336">No answer matches “{{ q2 }}”. Ask us directly below.</p>
      </sc-if>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:24px;border-radius:18px;background:#4a0b0f;color:#f7f4f4">
        <p style="font-size:22px;line-height:1.2;letter-spacing:-.02em">Still need help?</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <a href="https://wa.me/251941444555" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:22px;background:#f7f4f4;color:#170a0b;font-size:14px;font-weight:500" style-hover="background:#140607;color:#f7f4f4">WhatsApp</a>
          <a href="tel:+251116686979" style="display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:22px;border:1px solid rgba(247,244,244,.45);font-size:14px" style-hover="border-color:#f7f4f4">Call</a>
          <a href="Contact.dc.html" style="display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:22px;border:1px solid rgba(247,244,244,.45);font-size:14px" style-hover="border-color:#f7f4f4">Contact page</a>
        </div>
      </div>
    </div>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,900px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { q: '', open: '0-0', wide: window.innerWidth >= 900 };
  componentDidMount() { this.w = () => (window.ZEF ? this.forceUpdate() : (this.t = setTimeout(this.w, 30))); this.w(); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const Z = window.ZEF;
    const s = this.state;
    const base = { q: s.q, q2: s.q, hasQ: !!s.q.trim(), onQ: (e) => this.setState({ q: e.target.value }), clearQ: () => this.setState({ q: '' }), navPos: s.wide ? 'sticky' : 'static' };
    if (!Z) return { ...base, topics: [], groups: [] };
    const toks = s.q.toLowerCase().split(/\s+/).filter((t) => t.length > 1);
    const groups = Z.HELP.map(([label, items], gi) => ({
      id: 'topic-' + gi, label,
      items: items.filter(([q, a]) => !toks.length || toks.every((t) => (q + ' ' + a).toLowerCase().includes(t))).map(([q, a], k) => {
        const key = gi + '-' + k; const on = s.open === key || (toks.length > 0 && k === 0);
        return { q, a, aria: on ? 'true' : 'false', rows: on ? '1fr' : '0fr', rot: on ? '45deg' : '0deg', bg: on ? '#8c1c22' : '#e6e2e2', fg: on ? '#f7f4f4' : '#170a0b', toggle: () => this.setState({ open: s.open === key ? '' : key }) };
      }),
    })).filter((g) => g.items.length);
    return { ...base, groups, none: !groups.length, topics: Z.HELP.map(([label], gi) => ({ label, href: '#topic-' + gi })) };
  }
}

</script>
</body>
</html>
